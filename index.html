<style>
:root{--bg:#FAFAF8;--card:#fff;--fg:#2A1A0E;--fg3:#9C8575;--brown:#5C2D0E;--gold:#E8A020;--border:#E5DDD4;--red:#C0392B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A0F08;--card:#2A1A0E;--fg:#F5EDE0;--fg3:#8B7055;--brown:#D4845A;--gold:#F0B840;--border:#3D2518;--red:#E57373}}
:root[data-theme="dark"]{--bg:#1A0F08;--card:#2A1A0E;--fg:#F5EDE0;--fg3:#8B7055;--brown:#D4845A;--gold:#F0B840;--border:#3D2518;--red:#E57373}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px}
.box{width:100%;max-width:340px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 22px;text-align:center;box-shadow:0 4px 18px rgba(92,45,14,.08)}
img{width:72px;height:72px;border-radius:18px}
h1{font:900 24px Georgia,serif;margin:14px 0 2px}
h1 .v{color:var(--brown)}h1 .p{color:var(--gold)}
.sub{color:var(--fg3);font-size:12px;margin-bottom:22px}
input[type=password]{width:100%;padding:12px 14px;font-size:16px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);color:var(--fg);outline:none}
input[type=password]:focus{border-color:var(--gold)}
label{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:var(--fg3);margin:12px 0 16px}
button{width:100%;padding:12px;font-size:15px;font-weight:600;border:none;border-radius:10px;background:var(--brown);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <img src="icon-192.png" alt="">
  <h1><span class="v">Valle</span><span class="p">Pan</span></h1>
  <div class="sub">Acceso privado para socios</div>
  <input type="text" name="username" value="vallepan" autocomplete="username" hidden>
  <input type="password" id="pw" placeholder="PIN" inputmode="numeric" autocomplete="current-password" required>
  <label><input type="checkbox" id="rem" checked> Recordar en este dispositivo</label>
  <button id="b">Entrar</button>
  <div class="err" id="e"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORE = 'vp_key_v1';
async function deriveRaw(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(P.s), iterations:P.n}, base, 256));
}
async function decryptWith(raw){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){
  // Inyecta la app en ESTA misma página (sin document.write) para que el móvil mantenga el viewport.
  const doc = new DOMParser().parseFromString(html, 'text/html');
  document.querySelectorAll('style').forEach(n => n.remove());
  doc.head.querySelectorAll('style,link,title').forEach(n => document.head.appendChild(document.importNode(n, true)));
  const body = document.importNode(doc.body, true);
  document.body.replaceWith(body);
  body.querySelectorAll('script').forEach(old => {
    const sc = document.createElement('script');
    for (const at of old.attributes) sc.setAttribute(at.name, at.value);
    sc.textContent = old.textContent;
    old.replaceWith(sc);
  });
  window.scrollTo(0, 0);
}
const toB64 = u => btoa(String.fromCharCode(...u));
(async () => {
  let k = null; try { k = localStorage.getItem(KEY_STORE); } catch(e) {}
  if (!k) return;
  document.getElementById('f').style.visibility='hidden';
  try { show(await decryptWith(b64(k))); }
  catch(e) { try { localStorage.removeItem(KEY_STORE); } catch(_){} document.getElementById('f').style.visibility=''; }
})();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('b'), err = document.getElementById('e');
  btn.disabled = true; btn.textContent = 'Abriendo…'; err.textContent = '';
  let html;
  try {
    const raw = await deriveRaw(document.getElementById('pw').value);
    html = await decryptWith(raw);
    if (document.getElementById('rem').checked) { try { localStorage.setItem(KEY_STORE, toB64(raw)); } catch(e){} }
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Entrar'; err.textContent = 'PIN incorrecto';
    return;
  }
  show(html);
});

  b.style.cssText='position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99999;padding:13px 24px;border:none;border-radius:26px;background:#5C2D0E;color:#fff;font:600 15px system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer';
  b.onclick=function(){ var p=window.__vpDP; if(!p) return; p.prompt(); p.userChoice.then(function(){ window.__vpDP=null; b.remove(); }); };
  document.body.appendChild(b);
}
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); window.__vpDP=e; show(); });
window.addEventListener('appinstalled', function(){ window.__vpDP=null; var b=document.getElementById('vp-inst'); if(b) b.remove(); });
if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', show); else show();
})();</script>
